# ==============================================================================
# Example A  -  Large US retail bank
# ------------------------------------------------------------------------------
# Two production data centres (active/active), one DR site, plus regional hubs
# that aggregate branch traffic. Every prod site runs a two-host vCMP cluster
# with tenants separated into DMZ / App / Internal / PCI zones. GTM is anycast
# across the three core sites. Management is a full BIG-IQ estate with two CMs
# and regional data collection devices.
#
# Convention used here: <site>-<zone>-<role><nn><a|b>.bank.example
# ==============================================================================

# ---- Ashburn (Prod)
nva|name|Ashburn (Prod)
nva|gtm|true
nva|host|nva-vcmp01.bank.example
nva|host|nva-vcmp02.bank.example
nva|tenant|DMZ|nva-dmz-waf01a.bank.example|nva-vcmp01
nva|tenant|DMZ|nva-dmz-waf01b.bank.example|nva-vcmp02
nva|tenant|App|nva-app-ltm01a.bank.example|nva-vcmp01
nva|tenant|App|nva-app-ltm01b.bank.example|nva-vcmp02
nva|tenant|Internal|nva-internal-ltm01a.bank.example|nva-vcmp01
nva|tenant|Internal|nva-internal-ltm01b.bank.example|nva-vcmp02
nva|tenant|PCI|nva-pci-ltm01a.bank.example|nva-vcmp01
nva|tenant|PCI|nva-pci-ltm01b.bank.example|nva-vcmp02
nva|gtmdev|nva-gtm01.bank.example
nva|gtmdev|nva-gtm02.bank.example

