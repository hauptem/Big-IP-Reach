# ==============================================================================
# Stress test  -  50 sites, 12 cloud, one BIG-IQ (2 CM + 8 DCD)
# ------------------------------------------------------------------------------
# Every site has a two-host vCMP cluster. The first 25 sites carry GTM. Tenants
# are spread across 2 to 4 zones per site. Twelve cloud blocks follow. BIG-IQ is
# a single block whose ten devices (2 Central Managers + 8 Data Collection
# Devices) are distributed across four locations, named accordingly.
# ==============================================================================

