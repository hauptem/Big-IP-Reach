# ==============================================================================
# Example B  -  Cloud-first SaaS company
# ------------------------------------------------------------------------------
# Almost everything is BIG-IP Virtual Edition running in public cloud, spread
# across three providers and several regions. Each region is its own cloud
# block (a card and a filter button), so an operator can jump straight to
# 'Frankfurt' or 'Tokyo'. A single small on-prem site fronts the corporate
# office and the CI/CD build farm. GTM runs as VE in the two primary regions.
# Management is a lean BIG-IQ pair in the primary cloud region.
# ==============================================================================

# ---- AWS
aws-use1|type|cloud
aws-use1|name|AWS us-east-1
aws-use1|gtm|true
aws-use1|device|aws-use1-ltm01.saas.example
aws-use1|device|aws-use1-ltm02.saas.example
aws-use1|gtmdev|aws-use1-gtm01.saas.example

aws-usw2|type|cloud
aws-usw2|name|AWS us-west-2
aws-usw2|device|aws-usw2-ltm01.saas.example
aws-usw2|device|aws-usw2-ltm02.saas.example

aws-euw1|type|cloud
aws-euw1|name|AWS eu-west-1
aws-euw1|device|aws-euw1-ltm01.saas.example
aws-euw1|device|aws-euw1-ltm02.saas.example

