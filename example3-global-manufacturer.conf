# ==============================================================================
# Example C  -  Global manufacturer
# ------------------------------------------------------------------------------
# Three regional data centres (Americas, EMEA, APAC), each a vCMP cluster with
# OT (operational technology / plant-floor) kept in its own zone away from IT.
# Dozens of plants worldwide, each a single lightweight appliance pair, grouped
# by region in the id so they sort together. A cloud DR region stands in for
# the Americas DC. GTM is at the three regional DCs. Several future plants are
# pre-staged disabled, to be enabled as they come online.
# ==============================================================================

# ---- Americas DC (Detroit)
dc-am|name|Americas DC (Detroit)
dc-am|gtm|true
dc-am|host|det-vcmp01.mfg.example
dc-am|host|det-vcmp02.mfg.example
dc-am|tenant|IT|det-it-ltm01a.mfg.example|det-vcmp01
dc-am|tenant|IT|det-it-ltm01b.mfg.example|det-vcmp02
dc-am|tenant|OT|det-ot-ltm01a.mfg.example|det-vcmp01
dc-am|tenant|OT|det-ot-ltm01b.mfg.example|det-vcmp02
dc-am|tenant|DMZ|det-dmz-ltm01a.mfg.example|det-vcmp01
dc-am|tenant|DMZ|det-dmz-ltm01b.mfg.example|det-vcmp02
dc-am|gtmdev|det-gtm01.mfg.example

