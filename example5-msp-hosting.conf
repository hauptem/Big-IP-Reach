# ==============================================================================
# Example E  -  Managed service provider (multi-tenant hosting)
# ------------------------------------------------------------------------------
# One shared platform in two data centres, carved up per customer. Each customer
# is its own site block (id = cust-<code>) so support can filter to exactly one
# customer's devices. Shared platform infrastructure is its own site. Two cloud
# points of presence provide overflow and DDoS scrubbing. Offboarded and
# not-yet-live customers are kept disabled rather than deleted, for audit.
#
# Naming: <cust>-<dc>-<role><nn>.mspnet.example ; dc is 'e' (East) or 'w' (West).
# ==============================================================================

# ---- Shared platform
platform|name|Shared Platform
platform|gtm|true
platform|host|plat-e-vcmp01.mspnet.example
platform|host|plat-e-vcmp02.mspnet.example
platform|host|plat-w-vcmp01.mspnet.example
platform|host|plat-w-vcmp02.mspnet.example
platform|tenant|Ingress|plat-e-ingress01.mspnet.example|plat-e-vcmp01
platform|tenant|Ingress|plat-w-ingress01.mspnet.example|plat-w-vcmp01
platform|tenant|Mgmt|plat-e-mgmt01.mspnet.example|plat-e-vcmp02
platform|gtmdev|plat-e-gtm01.mspnet.example
platform|gtmdev|plat-w-gtm01.mspnet.example

