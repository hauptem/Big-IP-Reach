# ==============================================================================
# Example D  -  University
# ------------------------------------------------------------------------------
# Two campus data centres plus a medical centre that is run separately. Colleges
# and central services share the campus clusters, split into Academic, Research,
# Residential and DMZ zones. Some older units are reachable only by IP, and a few
# management GUIs sit on non-standard ports behind the campus proxy. GTM spans
# the two campus DCs. The hospital keeps its own site and its own BIG-IQ.
# ==============================================================================

# ---- Main Campus DC
dc-main|name|Main Campus DC
dc-main|gtm|true
dc-main|host|main-vcmp01.univ.edu
dc-main|host|main-vcmp02.univ.edu
dc-main|tenant|Academic|main-acad-ltm01a.univ.edu|main-vcmp01
dc-main|tenant|Academic|main-acad-ltm01b.univ.edu|main-vcmp02
dc-main|tenant|Research|main-research-ltm01a.univ.edu|main-vcmp01
dc-main|tenant|Research|main-research-ltm01b.univ.edu|main-vcmp02
dc-main|tenant|Residential|main-reslife-ltm01a.univ.edu|main-vcmp01
dc-main|tenant|DMZ|main-dmz-waf01a.univ.edu|main-vcmp01
dc-main|gtmdev|main-gtm01.univ.edu

# ---- West Campus DC
dc-west|name|West Campus DC
dc-west|gtm|true
dc-west|host|west-vcmp01.univ.edu
dc-west|host|west-vcmp02.univ.edu
dc-west|tenant|Academic|west-acad-ltm01a.univ.edu|west-vcmp01
dc-west|tenant|Academic|west-acad-ltm01b.univ.edu|west-vcmp02
dc-west|tenant|Research|west-research-ltm01a.univ.edu|west-vcmp01
dc-west|tenant|Research|west-research-ltm01b.univ.edu|west-vcmp02
dc-west|tenant|Residential|west-reslife-ltm01a.univ.edu|west-vcmp01
dc-west|tenant|DMZ|west-dmz-waf01a.univ.edu|west-vcmp01
dc-west|gtmdev|west-gtm01.univ.edu

# ---- Legacy / special cases
legacy|name|Legacy Services
legacy|host|Old Cluster A=10.14.0.11
legacy|host|Old Cluster B=10.14.0.12
# GUI behind the campus proxy on a non-standard port:
legacy|tenant|Library|Library LTM=https://lib-ltm01.univ.edu:10443/|Old Cluster A
# Reachable only by IP, given a readable label:
legacy|tenant|Archive|Archive LTM=10.14.7.30|Old Cluster B

# ---- Medical centre (separately administered)
med|name|Medical Center
med|gtm|true
med|host|med-vcmp01.med.univ.edu
med|host|med-vcmp02.med.univ.edu
med|tenant|Clinical|med-clin-ltm01a.med.univ.edu|med-vcmp01
med|tenant|Clinical|med-clin-ltm01b.med.univ.edu|med-vcmp02
med|tenant|EHR|med-ehr-ltm01a.med.univ.edu|med-vcmp01
med|gtmdev|med-gtm01.med.univ.edu

# ---- Management
bigiq|type|bigiq
bigiq|name|BIG-IQ (Campus)
bigiq|device|biq-cm01.univ.edu
bigiq|device|biq-cm02.univ.edu
bigiq|device|biq-dcd01.univ.edu
bigiq|device|biq-dcd02.univ.edu
